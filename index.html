<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lowercase only</title>
<meta name="description" content="一扇只收小寫字母的門。">
<style>
  :root {
    --bg: #0d0f12;
    --panel: #15181d;
    --line: #262b33;
    --text: #d6dbe2;
    --dim: #6b7480;
    --led-off: #22272e;
    --led-on: #f2b134;
    --ok: #5fd38d;
    --bad: #ff6b6b;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    padding: 24px 16px;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 24px 22px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 15px;
    letter-spacing: .28em;
    font-weight: 600;
  }
  .sub { margin: 0 0 26px; color: var(--dim); font-size: 13px; }

  .label {
    display: flex;
    justify-content: space-between;
    color: var(--dim);
    font-size: 11px;
    letter-spacing: .14em;
    margin-bottom: 10px;
  }
  .lights {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }
  .byte { display: flex; justify-content: space-between; }
  .led {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--led-off);
  }
  .led.on {
    background: var(--led-on);
    box-shadow: 0 0 6px var(--led-on);
  }

  .field { position: relative; }
  input {
    width: 100%;
    padding: 14px 64px 14px 14px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: 16px var(--mono);
    letter-spacing: .08em;
    text-transform: lowercase;
    outline: none;
  }
  input:focus { border-color: var(--dim); }
  .count {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    color: var(--dim);
    pointer-events: none;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    gap: 12px;
  }
  .caps {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; color: var(--dim); letter-spacing: .14em;
  }
  .caps .led.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  button {
    font: 13px var(--mono);
    letter-spacing: .14em;
    color: var(--bg);
    background: var(--text);
    border: 0;
    border-radius: 8px;
    padding: 11px 20px;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: wait; }

  .status {
    min-height: 20px;
    margin: 18px 0 0;
    font-size: 13px;
    letter-spacing: .1em;
  }
  .status.bad { color: var(--bad); }
  .status.ok { color: var(--ok); }
  .flag {
    display: none;
    margin-top: 12px;
    padding: 14px;
    border: 1px dashed var(--ok);
    border-radius: 8px;
    color: var(--ok);
    font-size: 14px;
    word-break: break-all;
  }

  details {
    margin-top: 24px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
    font-size: 13px;
    color: var(--dim);
  }
  summary { cursor: pointer; letter-spacing: .14em; font-size: 11px; }
  .hint { margin: 12px 0 0; }
  .hint button {
    color: var(--dim);
    background: none;
    border: 1px solid var(--line);
    padding: 6px 12px;
    font-size: 12px;
  }
  .hint p { margin: 8px 0 0; color: var(--text); display: none; }

  main.shake { animation: shake .35s; }
  @keyframes shake {
    25% { transform: translateX(-6px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-3px); }
  }
  @media (max-width: 420px) {
    main { padding: 22px 16px 18px; }
    .lights { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    main.shake { animation: none; }
  }
</style>
</head>
<body>
<main id="box">
  <h1>LOWERCASE ONLY</h1>
  <p class="sub">這扇門只認得小寫字母。</p>

  <div class="label"><span>LOCK STATE</span><span id="lockLen"></span></div>
  <div class="lights" id="lights" aria-hidden="true"></div>

  <form id="form" autocomplete="off">
    <div class="field">
      <input id="key" type="text" aria-label="通關字串"
             autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false"
             placeholder="type here">
      <span class="count" id="count">0</span>
    </div>
    <div class="row">
      <span class="caps"><span class="led" id="capsLed"></span>CAPS</span>
      <button type="submit" id="go">UNLOCK</button>
    </div>
  </form>

  <p class="status" id="status" role="status"></p>
  <div class="flag" id="flag"></div>

  <details>
    <summary>HINTS</summary>
    <div class="hint">
      <button type="button" data-hint="h1">提示 1</button>
      <p id="h1">你看到的，不一定是送出去的。</p>
    </div>
    <div class="hint">
      <button type="button" data-hint="h2">提示 2</button>
      <p id="h2">每個字母只說一件事。是哪個字母並不重要。</p>
    </div>
    <div class="hint">
      <button type="button" data-hint="h3">提示 3</button>
      <p id="h3">把亮著的燈全部熄掉，就會全部亮起來。</p>
    </div>
  </details>
</main>

<script>
// 用 tools/make-lock.mjs 產生，整段替換即可換題目
const LOCK = {
  lights: "00000100100111100100011111101001",
  iter: 200000,
  salt: "sN8sHMXVrEaoj3sEPA4Mag==",
  iv: "zDkIW4H9ouDwq6CW",
  ct: "oAeDEYQRvg1SdfHXwx3OhdhuBtQFWWlhOVKGFTUkAvfgAdKd6muiaQ8N9rs=",
};

const $ = (id) => document.getElementById(id);
const N = LOCK.lights.length;

// 燈號，每 8 顆一組
const wrap = $("lights");
for (let i = 0; i < N; i += 8) {
  const byte = document.createElement("div");
  byte.className = "byte";
  for (const c of LOCK.lights.slice(i, i + 8)) {
    const led = document.createElement("span");
    led.className = "led" + (c === "1" ? " on" : "");
    byte.appendChild(led);
  }
  wrap.appendChild(byte);
}
$("lockLen").textContent = N + " BIT";

const input = $("key");
input.addEventListener("input", () => {
  $("count").textContent = input.value.length;
});

// Caps Lock 指示燈
const capsLed = $("capsLed");
function caps(e) {
  if (e.getModifierState) {
    capsLed.classList.toggle("on", e.getModifierState("CapsLock"));
  }
}
document.addEventListener("keydown", caps);
document.addEventListener("keyup", caps);

document.querySelectorAll("[data-hint]").forEach((b) => {
  b.addEventListener("click", () => {
    $(b.dataset.hint).style.display = "block";
    b.style.display = "none";
  });
});

const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

// 大寫 = 1、小寫 = 0。不是字母或長度不對就直接不通過。
function toBits(s) {
  if (s.length !== N || /[^A-Za-z]/.test(s)) return null;
  return Array.from(s, (c) => (c === c.toUpperCase() ? "1" : "0")).join("");
}

async function tryOpen(bits) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey(
    "raw", enc.encode(bits), "PBKDF2", false, ["deriveKey"]
  );
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: unb64(LOCK.salt),
      iterations: LOCK.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
  const pt = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: unb64(LOCK.iv) }, key, unb64(LOCK.ct)
  );
  return new TextDecoder().decode(pt);
}

const status = $("status");
const box = $("box");
function deny() {
  status.className = "status bad";
  status.textContent = "ACCESS DENIED";
  box.classList.remove("shake");
  void box.offsetWidth;
  box.classList.add("shake");
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const bits = toBits(input.value);
  if (!bits) return deny();

  const go = $("go");
  go.disabled = true;
  status.className = "status";
  status.textContent = "...";
  try {
    const flag = await tryOpen(bits);
    status.className = "status ok";
    status.textContent = "ACCESS GRANTED";
    $("flag").textContent = flag;
    $("flag").style.display = "block";
    wrap.querySelectorAll(".led").forEach((l) => l.classList.add("on"));
    input.disabled = true;
    go.style.display = "none";
  } catch {
    deny();
  } finally {
    go.disabled = false;
  }
});
</script>
</body>
</html>
